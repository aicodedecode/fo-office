<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fo HQ · live office</title>
<style>
:root{
  --bg:#0b0e14; --panel:#121722; --panel2:#171e2b; --line:#232c3d;
  --txt:#e8ecf4; --dim:#8b96ab; --amber:#f5a623; --red:#ff5d5d; --green:#3ddc84; --slate:#5b6b85;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:var(--amber)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#f5a623,#ff7a45);display:flex;align-items:center;justify-content:center;font-size:22px}
h1{font-size:22px;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(61,220,132,.15);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(61,220,132,0)}}
.vbtns{display:flex;gap:8px;width:100%}
.vbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:7px 13px;border-radius:20px;cursor:pointer;font-family:inherit}
.vbtn.on{color:var(--txt);border-color:var(--amber)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:var(--dim)}
.stat.busy b{color:var(--amber)} .stat.stuck b{color:var(--red)} .stat.idle b{color:var(--slate)} .stat.floors b{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
#stage{height:600px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(1200px 520px at 50% 0%,#151b28,#0b0e14);position:relative;overflow:hidden;display:none}
#stage canvas{display:block}
#stage .hint{position:absolute;bottom:12px;left:16px;font-size:11px;color:var(--dim)}
.floor{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px}
.floor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.floor-emoji{font-size:20px}
.floor-name{font-size:15px;font-weight:700;letter-spacing:.3px}
.floor-tag{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:20px}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bot{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bot-top{display:flex;align-items:center;gap:8px}
.status{width:9px;height:9px;border-radius:50%;flex:none}
.st-busy{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1.6s infinite}
.st-stuck{background:var(--red);box-shadow:0 0 8px var(--red)}
.st-idle{background:var(--slate)}
@keyframes blink{50%{opacity:.35}}
.bot-name{font-size:13.5px;font-weight:600;line-height:1.35}
.bot-note{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:20px;max-height:80vh;overflow-y:auto}
.feed h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.ev{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.ev:last-child{border-bottom:0}
.ev-time{color:var(--dim);font-size:11px;margin-right:6px}
.chip{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:10px;margin-right:6px;text-transform:uppercase}
.c-started{background:rgba(245,166,35,.15);color:var(--amber)}
.c-done{background:rgba(61,220,132,.15);color:var(--green)}
.c-stuck{background:rgba(255,93,93,.15);color:var(--red)}
.c-note{background:rgba(91,107,133,.25);color:#a9b6cc}
.empty{color:var(--dim);font-size:13px;line-height:1.6}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:560px;margin-top:30px;line-height:1.6;font-size:14px}
footer{color:var(--dim);font-size:12px;margin-top:34px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🏢</div>
    <div><h1>Fo HQ</h1><div class="sub">one assistant, every floor, live status</div></div>
    <div class="sync"><span class="dot-live" id="livedot"></span><span id="sync">connecting…</span></div>
    <div class="vbtns"><button class="vbtn" id="v3d">🏢 3D office</button><button class="vbtn" id="vlist">☰ List</button></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div>
      <div id="stage"><div class="hint">drag to orbit · scroll to zoom · the office rotates on its own</div></div>
      <div id="floors"></div>
    </div>
    <aside class="feed"><h3>Live feed</h3><div id="feed" class="empty">waiting for the first post…</div></aside>
  </div>
  <footer>live stream · 20 s safety poll</footer>
</div>
<script>
const TOPIC=new URLSearchParams(location.search).get('t')||'';
let lastRosterTs=0,builtTs=-1,roster=null,events=[];
let mode=(innerWidth>=760)?'3d':'list';
const fmt=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
function dot(s){return '<span class="status st-'+s+'"></span>'}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- 2D list ---------- */
function renderList(){
  if(!roster){document.getElementById('floors').innerHTML='<div class="empty">No roster posted yet. Fo\'s duty drops one every 4 hours; live pings appear in the feed as they land.</div>';return}
  let html='';
  roster.floors.forEach((f,i)=>{
    html+='<div class="floor"><div class="floor-head"><span class="floor-emoji">'+(f.emoji||'🧩')+'</span><span class="floor-name">'+esc(f.name)+'</span><span class="floor-tag">floor '+String(i+1).padStart(2,'0')+'</span></div><div class="bots">';
    f.bots.forEach(b=>{html+='<div class="bot"><div class="bot-top">'+dot(b.status)+'<span class="bot-name">'+esc(b.name)+'</span></div>'+(b.note?'<div class="bot-note">'+esc(b.note)+'</div>':'')+'</div>'});
    html+='</div></div>';
  });
  document.getElementById('floors').innerHTML=html;
}
function renderStats(){
  if(!roster)return;
  const c={busy:0,stuck:0,idle:0};roster.floors.forEach(f=>f.bots.forEach(b=>c[b.status]=(c[b.status]||0)+1));
  document.getElementById('stats').innerHTML=
    '<div class="stat busy"><b>'+(c.busy||0)+'</b><span>busy</span></div>'+
    '<div class="stat stuck"><b>'+(c.stuck||0)+'</b><span>stuck</span></div>'+
    '<div class="stat idle"><b>'+(c.idle||0)+'</b><span>resting</span></div>'+
    '<div class="stat floors"><b>'+roster.floors.length+'</b><span>floors</span></div>';
}
function renderFeed(){
  const el=document.getElementById('feed');
  if(!events.length){el.className='empty';el.textContent='waiting for the first post…';return}
  el.className='';
  el.innerHTML=events.slice(-40).reverse().map(e=>{
    const kind=e.kind||'note';
    return '<div class="ev"><span class="ev-time">'+fmt(e.ts)+'</span><span class="chip c-'+esc(kind)+'">'+esc(kind)+'</span>'+esc(e.text||'')+'</div>';
  }).join('');
}

/* ---------- 3D office ---------- */
let scene,camera,renderer,controls,officeGroup,bots3D=[],inited=false,threeFailed=false;
function statusColor(s){return s==='busy'?0xf5a623:(s==='stuck'?0xff5d5d:0x5b6b85)}
function statusHex(s){return s==='busy'?'#f5a623':(s==='stuck'?'#ff5d5d':'#a9b6cc')}
function makeLabel(text,color,div){
  div=div||38;
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  ctx.font='600 44px system-ui,sans-serif';
  const w=Math.ceil(ctx.measureText(text).width)+30;
  cv.width=w;cv.height=64;
  ctx.font='600 44px system-ui,sans-serif';
  ctx.fillStyle=color;ctx.textBaseline='middle';ctx.fillText(text,15,34);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
  spr.scale.set(w/div,64/div,1);return spr;
}
function shortName(n){n=String(n);return n.length>30?n.slice(0,29)+'…':n}
function loadThree(cb){
  if(window.THREE){cb();return}
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload=()=>{
    const o=document.createElement('script');
    o.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
    o.onload=cb;o.onerror=()=>{threeFailed=true;cb()};
    document.head.appendChild(o);
  };
  s.onerror=()=>{threeFailed=true;cb()};
  document.head.appendChild(s);
}
function init3D(){
  if(threeFailed){setMode('list');return}
  const box=document.getElementById('stage');
  try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){threeFailed=true;setMode('list');return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  box.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b0e14);
  scene.fog=new THREE.Fog(0x0b0e14,70,170);
  camera=new THREE.PerspectiveCamera(45,1,.1,400);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;
  controls.autoRotate=true;controls.autoRotateSpeed=.55;
  controls.minDistance=18;controls.maxDistance=110;
  scene.add(new THREE.HemisphereLight(0xbcd3ff,0x0b0e14,1.0));
  const d=new THREE.DirectionalLight(0xffffff,.65);d.position.set(24,50,34);scene.add(d);
  officeGroup=new THREE.Group();scene.add(officeGroup);
  resize();addEventListener('resize',resize);
  animate();
  inited=true;
  if(roster){builtTs=-1;buildOffice()}
}
function resize(){
  const b=document.getElementById('stage');const w=b.clientWidth,h=b.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
function buildOffice(){
  if(!inited||!roster)return;
  while(officeGroup.children.length){officeGroup.remove(officeGroup.children[0])}
  bots3D=[];
  const GAP=13;
  const n=roster.floors.length;
  roster.floors.forEach((f,i)=>{
    const y=-i*GAP;
    const g=new THREE.Group();g.position.y=y;
    const bots=f.bots||[];
    const perRow=Math.min(4,Math.max(1,bots.length));
    const rows=Math.ceil(bots.length/perRow);
    const W=Math.max(34,perRow*7+10),D=Math.max(24,rows*7+11);
    const slab=new THREE.Mesh(new THREE.BoxGeometry(W,.8,D),new THREE.MeshStandardMaterial({color:0x161c29,roughness:.9}));
    slab.position.y=-.4;g.add(slab);
    const wall=new THREE.Mesh(new THREE.BoxGeometry(W,7,.4),new THREE.MeshStandardMaterial({color:0x1d2536,roughness:.95}));
    wall.position.set(0,3.1,-D/2+.2);g.add(wall);
    const lab=makeLabel((f.emoji?f.emoji+' ':'')+f.name,'#e8ecf4',30);
    lab.position.set(0,6.6,-D/2+1.2);g.add(lab);
    bots.forEach((b,k)=>{
      const col=k%perRow,row=Math.floor(k/perRow);
      const x=(col-(perRow-1)/2)*7.4, z=(rows-1)*3.5-row*7;
      const bg=new THREE.Group();bg.position.set(x,0,z);
      const desk=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.15,1.6),new THREE.MeshStandardMaterial({color:0x273043,roughness:.8}));
      desk.position.set(0,.58,0);bg.add(desk);
      const scr=new THREE.Mesh(new THREE.BoxGeometry(1.6,.95,.12),new THREE.MeshStandardMaterial({color:0x10141c,emissive:statusColor(b.status),emissiveIntensity:b.status==='idle'?.35:1}));
      scr.position.set(0,1.75,.45);bg.add(scr);
      const ch=new THREE.Group();ch.position.z=-1.3;
      const body=new THREE.Mesh(new THREE.CylinderGeometry(.42,.55,1.5,12),new THREE.MeshStandardMaterial({color:0x9aa7bd,roughness:.7}));
      body.position.y=1.85;ch.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),new THREE.MeshStandardMaterial({color:0xe8ecf4,roughness:.55}));
      head.position.y=2.95;ch.add(head);
      bg.add(ch);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(1.05,.09,8,32),new THREE.MeshBasicMaterial({color:statusColor(b.status)}));
      ring.rotation.x=-Math.PI/2;ring.position.set(0,.06,-1.3);bg.add(ring);
      const nl=makeLabel(shortName(b.name),statusHex(b.status));nl.position.set(0,4.5,-1.3);bg.add(nl);
      let mark=null;
      if(b.status==='stuck'){mark=makeLabel('!','#ff5d5d',18);mark.position.set(1.3,3.9,-1.3);bg.add(mark)}
      bots3D.push({ch:ch,mark:mark,status:b.status,ph:k*1.7});
      g.add(bg);
    });
    officeGroup.add(g);
  });
  camera.position.set(0,-(n-1)*GAP/2+16,Math.max(44,W*0.9));
  controls.target.set(0,-(n-1)*GAP/2,0);
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(!inited)return;
  const t=clock.getElapsedTime();
  bots3D.forEach(b=>{
    if(b.status==='busy'){b.ch.position.y=Math.abs(Math.sin(t*2.4+b.ph))*.35}
    else b.ch.position.y*=.9;
    if(b.mark){const s=1+Math.sin(t*5+b.ph)*.18;b.mark.scale.multiplyScalar(s/b.mark.userData.s||1);b.mark.userData.s=s}
  });
  controls.update();
  renderer.render(scene,camera);
}

/* ---------- mode ---------- */
function setMode(m){
  mode=m;
  document.getElementById('v3d').classList.toggle('on',m==='3d');
  document.getElementById('vlist').classList.toggle('on',m==='list');
  document.getElementById('stage').style.display=m==='3d'?'block':'none';
  document.getElementById('floors').style.display=m==='list'?'block':'none';
  if(m==='3d'&&!threeFailed){
    if(!inited){loadThree(()=>{init3D()})}
    else{resize();builtTs=-1;buildOffice()}
  }
  if(m==='3d'&&threeFailed){mode='list';document.getElementById('v3d').classList.remove('on');document.getElementById('vlist').classList.add('on');document.getElementById('stage').style.display='none';document.getElementById('floors').style.display='block'}
}
document.getElementById('v3d').onclick=()=>setMode('3d');
document.getElementById('vlist').onclick=()=>setMode('list');

/* ---------- data ---------- */
function ingest(m){
  let p;try{p=JSON.parse(m.message)}catch(e){return}
  if(!p||typeof p!=='object'||!p.type)return;
  if(p.type==='roster'&&(!roster||(p.ts||0)>=lastRosterTs)){roster=p;lastRosterTs=p.ts||0;renderList();renderStats();if(mode==='3d'&&inited){builtTs=-1;buildOffice()}}
  else if(p.type==='event'&&(!lastRosterTs||(p.ts||0)>=lastRosterTs-12*3600e3)){
    if(!events.some(x=>x.ts===p.ts&&x.text===p.text)){events.push(p);renderFeed()}
  }
  document.getElementById('sync').textContent='synced '+fmt(Date.now());
}
async function poll(){
  if(!TOPIC)return;
  document.getElementById('livedot').style.background='var(--amber)';
  try{
    const r=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1&since=24h');
    (await r.text()).trim().split('\n').filter(Boolean).map(JSON.parse).forEach(ingest);
  }catch(e){document.getElementById('sync').textContent='reconnecting…'}
  document.getElementById('livedot').style.background='var(--green)';
}
if(TOPIC){
  poll();setInterval(poll,20000);
  const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');
  es.onmessage=e=>{try{ingest(JSON.parse(e.data))}catch(_){}};
}else{
  document.getElementById('floors').innerHTML='<div class="setup"><h2 style="margin-bottom:10px">Fo HQ setup</h2>This dashboard reads a private Fo status channel. Open it with your channel id appended:<br><br><code>?t=fo-hq-…</code><br><br>Fo posts a full roster snapshot every 4 hours and live pings whenever work starts, finishes or gets stuck.</div>';
  document.getElementById('stats').innerHTML='';document.getElementById('feed').parentElement.style.display='none';
}
setMode(mode);
</script>
</body>
</html>
